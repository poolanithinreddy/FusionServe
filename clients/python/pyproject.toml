[project]
name = "fusionserve-client"
version = "0.1.0"
description = "Python client and benchmark harness for FusionServe"
requires-python = ">=3.9"
dependencies = []  # runtime is stdlib-only by design

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fusionserve*"]
