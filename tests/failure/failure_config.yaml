# Gateway config for failure testing: deliberately tiny limits so overload and
# circuit-breaker behavior is easy to trigger and observe.
server:
  bind_addr: "127.0.0.1:18780"
  global_max_inflight: 64
  default_deadline_ms: 3000
admission:
  queue_capacity: 2
  queue_timeout_ms: 500
  circuit_breaker:
    failure_threshold: 3
    open_cooldown_ms: 1000
    half_open_success_threshold: 1
health:
  poll_interval_ms: 500
  unhealthy_after: 2
models:
  resnet50:
    workload: image_classification
    backend: triton
    protocol: http
    endpoint: "http://127.0.0.1:18701"
    timeout_ms: 1000
    max_concurrency: 1
    retry: { max_retries: 1, only_on_connect_error: true }
  qwen_small:
    workload: chat_completion
    backend: dynamo
    protocol: http
    endpoint: "http://127.0.0.1:18700"
    timeout_ms: 3000
    max_concurrency: 4
    streaming: true
    retry: { max_retries: 0, only_on_connect_error: true }
