services:
  triton:
    image: nvcr.io/nvidia/tritonserver:26.04-py3
    command:
      - tritonserver
      - --model-repository=/models
      - --strict-readiness=true
      - --allow-metrics=true
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ../../models/triton:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 24
