# Dynamo frontend/router (GPU). vLLM workers register with it; scale workers
# with their own Deployment. This is a minimal single-worker illustration —
# see docs/deployment.md and the Dynamo docs for multi-worker topologies.
apiVersion: apps/v1
kind: Deployment
metadata: { name: dynamo-frontend, namespace: fusionserve }
spec:
  replicas: 1
  selector: { matchLabels: { app: dynamo-frontend } }
  template:
    metadata: { labels: { app: dynamo-frontend } }
    spec:
      containers:
        - name: dynamo
          image: nvcr.io/nvidia/ai-dynamo/dynamo:1.2.1
          ports: [ { containerPort: 8000 } ]
          resources:
            limits: { nvidia.com/gpu: 1 }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: dynamo-frontend, namespace: fusionserve }
spec:
  selector: { app: dynamo-frontend }
  ports: [ { port: 8000, targetPort: 8000 } ]
