global:
  scrape_interval: 5s
scrape_configs:
  - job_name: fusionserve-gateway
    static_configs:
      - targets: ["gateway:8080"]
  # Triton exposes its own metrics on :8002 in the GPU profile.
  - job_name: triton
    static_configs:
      - targets: ["triton:8002"]
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
